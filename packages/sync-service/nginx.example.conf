# In den bestehenden server { … }-Block von Foundry einfügen.
# Der Dienst ist dann unter https://<deine-foundry-domain>/vtf-sync/ erreichbar.
location /vtf-sync/ {
    proxy_pass http://vtf-sync:8787/;      # oder http://127.0.0.1:8787/ ohne Docker-Netz
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 512m;             # wie VTF_MAX_MB
    proxy_request_buffering off;
}
