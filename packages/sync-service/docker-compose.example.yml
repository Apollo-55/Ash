# Beispiel: vtf-sync neben felddy/foundryvtt. Pfade und Benutzer an deine Installation anpassen.
services:
  foundry:
    image: felddy/foundryvtt:13
    # … deine bestehende Konfiguration …
    volumes:
      - foundry-data:/data

  vtf-sync:
    image: ghcr.io/apollo-55/vtf-sync:latest   # von GitHub gebaut; Update: docker compose pull vtf-sync && docker compose up -d vtf-sync
    # build: ./vtf-sync          # stattdessen, wenn du dist/vtf-sync.zip selbst entpackst (dann up -d --build)
    restart: unless-stopped
    user: "421:421"              # wie Foundry (felddy: FOUNDRY_UID/FOUNDRY_GID, Standard 421)
    environment:
      VTF_TOKEN: "hier-ein-langes-zufälliges-geheimnis"   # z. B. openssl rand -hex 32
      # optional: einfaches Passwort für die Download-Seite des Obsidian-Plugins, <VTF_PUBLIC_URL>/plugin
      VTF_DOWNLOAD_PASSWORD: ""
      VTF_DATA_DIR: /data/vault-to-foundry
      # so erreicht Foundry den Dienst; Manifest-URL für das Modul ist dann <VTF_PUBLIC_URL>/module/module.json
      VTF_PUBLIC_URL: "https://<deine-foundry-domain>/vtf-sync"
    volumes:
      # nur der Unterordner von Foundrys Data-Ordner, sonst nichts
      - type: volume
        source: foundry-data
        target: /data/vault-to-foundry
        volume:
          subpath: Data/vault-to-foundry
    expose:
      - "8787"

volumes:
  foundry-data:
