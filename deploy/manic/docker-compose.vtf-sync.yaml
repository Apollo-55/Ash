# Ergänzung für die docker-compose.yaml der DSA-Instanz (felddy, user 1001:1001).
# Diesen Dienst unter „services:“ einfügen; VTF_TOKEN in .env (Rechte 600) neben der Compose-Datei.
# Das Image baut GitHub bei jeder Änderung auf main. Update:
#   docker compose pull vtf-sync && docker compose up -d vtf-sync
services:
  vtf-sync:
    image: ghcr.io/apollo-55/vtf-sync:latest
    container_name: vtf-sync-dsa
    user: 1001:1001
    restart: unless-stopped
    environment:
      - VTF_TOKEN=${VTF_TOKEN}
      # einfaches Passwort für die Download-Seite des Obsidian-Plugins: https://dsa.manic-gaming.de/vtf-sync/plugin
      - VTF_DOWNLOAD_PASSWORD=${VTF_DOWNLOAD_PASSWORD:-}
      # öffentliche Adresse: Foundry installiert das Modul über …/module/module.json
      - VTF_PUBLIC_URL=https://dsa.manic-gaming.de/vtf-sync
    volumes:
      - /manic/foundry/yvtt/data/Data/vault-to-foundry:/data/vault-to-foundry
    ports:
      - 127.0.0.1:8787:8787
