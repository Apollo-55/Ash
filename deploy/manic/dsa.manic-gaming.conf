# /etc/nginx/sites-enabled/dsa.manic-gaming.conf – bestehende Datei, ergänzt um den Block „vtf-sync“
server {

            # Enter your fully qualified domain name or leave blank
            server_name             dsa.manic-gaming.de;

            # Listen on port 443 using SSL certificates
            listen                  443 ssl;
            ssl_certificate         /etc/letsencrypt/live/manic-gaming.de/fullchain.pem; # managed by Certbot
            ssl_certificate_key     /etc/letsencrypt/live/manic-gaming.de/privkey.pem; # managed by Certbot

            # Sets the Max Upload size to 300 MB
            client_max_body_size 300M;

            # ---- vtf-sync: Obsidian → Foundry (Vault to Foundry) ----
            # Der Dienst läuft nur lokal auf 127.0.0.1:8787, nach außen geht er nur über HTTPS hier.
            location /vtf-sync/ {
                proxy_pass http://127.0.0.1:8787/;
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                client_max_body_size 512m;
                proxy_request_buffering off;
                proxy_read_timeout 300s;
            }

            # Proxy Requests to Foundry VTT
            location / {

                # Set proxy headers
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                # These are important to support WebSockets
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "Upgrade";

                # Make sure to set your Foundry VTT port number
                proxy_pass http://localhost:30000;
            }

}
