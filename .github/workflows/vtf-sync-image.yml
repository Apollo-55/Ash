# Jeder Push auf main: Tests und Build, dann das Image mit dem Tag "dev" zum Ausprobieren.
# "latest" und die Versionsnummer vergibt nur der Workflow "Version veröffentlichen" (release.yml).
name: vtf-sync-Image (dev)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: vtf-sync-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/vtf-sync-image
        with:
          tags: dev sha-${{ steps.sha.outputs.short }}
          token: ${{ secrets.GITHUB_TOKEN }}
