# Baut den Sync-Dienst vtf-sync (mit Foundry-Modul und den Obsidian-Plugins aus demselben Build) als
# Docker-Image und legt es in die GitHub Container Registry: ghcr.io/<owner>/vtf-sync
# Auf dem Server reicht danach: docker compose pull vtf-sync && docker compose up -d vtf-sync
name: vtf-sync-Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: vtf-sync-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # first the further plugins, so the service build picks them up
      - run: npm run build:generator
      - run: npm run build
      - name: Image bauen und hochladen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vtf-sync"
          version="$(sed -n "s/^const VERSION = '\(.*\)'$/\1/p" packages/sync-service/server.mjs)"
          test -n "$version"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # the Dockerfile only copies files, so both platforms build without emulation
          docker buildx create --use
          docker buildx build dist/vtf-sync \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image:latest" --tag "$image:$version" --tag "$image:sha-${GITHUB_SHA::7}" \
            --push
          echo "Image: \`$image:latest\`, \`$image:$version\`, \`$image:sha-${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
